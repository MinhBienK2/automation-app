name: Desktop Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish when running this workflow manually, for example v0.1.0-internal.1
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: desktop-release-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build Electron main and preload
        run: npm run build:electron

  package:
    name: Package ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    environment: internal-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            package_script: electron:pack:mac
            artifact_name: automation-app-macos
            artifact_subject_paths: |
              release/*.dmg
              release/*.zip
            release_subject_paths: |
              release/*.dmg
              release/*.zip
              release/SHA256SUMS
              release/release-manifest.json
              release/sbom.cyclonedx.json
          - label: Windows
            os: windows-latest
            package_script: electron:pack:win
            artifact_name: automation-app-windows
            artifact_subject_paths: |
              release/*.exe
              release/*.zip
            release_subject_paths: |
              release/*.exe
              release/*.zip
              release/SHA256SUMS
              release/release-manifest.json
              release/sbom.cyclonedx.json
          - label: Ubuntu Linux
            os: ubuntu-latest
            package_script: electron:pack:linux
            artifact_name: automation-app-ubuntu-linux
            artifact_subject_paths: |
              release/*.AppImage
              release/*.deb
              release/*.tar.gz
            release_subject_paths: |
              release/*.AppImage
              release/*.deb
              release/*.tar.gz
              release/latest*.yml
              release/SHA256SUMS
              release/release-manifest.json
              release/sbom.cyclonedx.json

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Configure optional signing environment
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          write_env() {
            local name="$1"
            local value="$2"
            local delimiter="__${name}_EOF__"
            {
              echo "${name}<<${delimiter}"
              echo "${value}"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          }

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ -n "$MAC_CSC_LINK" && -n "$MAC_CSC_KEY_PASSWORD" ]]; then
              write_env "CSC_LINK" "$MAC_CSC_LINK"
              write_env "CSC_KEY_PASSWORD" "$MAC_CSC_KEY_PASSWORD"
            else
              echo "macOS signing secrets are not configured; building an unsigned internal artifact."
            fi

            if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              write_env "APPLE_ID" "$APPLE_ID"
              write_env "APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_APP_SPECIFIC_PASSWORD"
              write_env "APPLE_TEAM_ID" "$APPLE_TEAM_ID"
            else
              echo "Apple notarization secrets are not configured; skipping notarization."
            fi
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -n "$WIN_CSC_LINK" && -n "$WIN_CSC_KEY_PASSWORD" ]]; then
              write_env "CSC_LINK" "$WIN_CSC_LINK"
              write_env "CSC_KEY_PASSWORD" "$WIN_CSC_KEY_PASSWORD"
            else
              echo "Windows signing secrets are not configured; building an unsigned internal artifact."
            fi
          fi

      - name: Package desktop app
        run: npm run ${{ matrix.package_script }}

      - name: Generate release SBOM
        run: npm run release:sbom

      - name: Generate checksum manifest
        run: npm run release:manifest

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        continue-on-error: true
        with:
          subject-path: ${{ matrix.release_subject_paths }}

      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        continue-on-error: true
        with:
          subject-path: ${{ matrix.artifact_subject_paths }}
          sbom-path: release/sbom.cyclonedx.json

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/**/*
            !release/**/*.blockmap
            !release/*-unpacked/**
            !release/builder-debug.yml
            !release/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    environment: internal-release
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Internal desktop release ${RELEASE_TAG}

          This release was built by GitHub Actions from ${GITHUB_SHA}.
          Verify the attached SHA256SUMS files and release-manifest.json files before installation.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
