<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazy Load Footer Component</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      padding: 24px;
      background: #111827;
      color: white;
      text-align: center;
    }

    section {
      min-height: 100vh;
      padding: 48px;
      border-bottom: 1px solid #ddd;
      background: white;
    }

    section:nth-child(even) {
      background: #f9fafb;
    }

    #footer-placeholder {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e7eb;
      color: #555;
      font-size: 18px;
    }

    footer {
      padding: 40px;
      background: #111827;
      color: white;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    footer a {
      color: #93c5fd;
      margin: 0 8px;
      text-decoration: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading {
      color: #2563eb;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Demo Lazy Load Component</h1>
    <p>Footer chỉ được render khi bạn scroll gần cuối trang</p>
  </header>

  <section>
    <h2>Section 1</h2>
    <p>Nội dung đầu trang. Footer chưa được load.</p>
  </section>

  <section>
    <h2>Section 2</h2>
    <p>Scroll tiếp xuống dưới...</p>
  </section>

  <section>
    <h2>Section 3</h2>
    <p>Khi gần tới footer, JavaScript mới load footer component.</p>
  </section>

  <div id="footer-placeholder">
    Footer chưa load...
  </div>

  <script>
    const footerPlaceholder = document.getElementById("footer-placeholder");

    let isFooterLoaded = false;

    function loadFooterComponent() {
      if (isFooterLoaded) return;

      isFooterLoaded = true;

      console.log("Bắt đầu lazy-load Footer component...");

      footerPlaceholder.innerHTML = `
        <span class="loading">Đang tải Footer...</span>
      `;

      // Giả lập component nặng đang được tải
      setTimeout(() => {
        footerPlaceholder.outerHTML = `
          <footer>
            <h2>Footer Component</h2>
            <p>Footer này vừa được lazy-load khi người dùng scroll tới gần cuối trang.</p>

            <nav>
              <a href="#">Home</a>
              <a href="#">About</a>
              <a href="#">Contact</a>
            </nav>

            <p style="margin-top: 24px;">
              © 2026 Lazy Load Demo
            </p>
          </footer>
        `;

        console.log("Footer component đã được load!");
      }, 1000);
    }

    const observer = new IntersectionObserver(
      (entries) => {
        const entry = entries[0];

        if (entry.isIntersecting) {
          loadFooterComponent();
          observer.disconnect();
        }
      },
      {
        // Load sớm hơn 200px trước khi footer xuất hiện
        root: null,
        rootMargin: "200px",
        threshold: 0
      }
    );

    observer.observe(footerPlaceholder);
  </script>
</body>
</html>
